name: Evaluate research baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/draws.json'
      - 'scripts/evaluate.py'
      - 'tests/**'
permissions:
  contents: write
jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py
      - name: Commit audit summary if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/evaluation-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update historical completeness and model readiness'
          git push
