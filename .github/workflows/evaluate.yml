name: Evaluate research baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/draws.json'
      - 'scripts/evaluate.py'
      - 'tests/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py
