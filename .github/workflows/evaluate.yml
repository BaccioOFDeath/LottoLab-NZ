name: Evaluate research baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/draws.json'
      - 'scripts/evaluate.py'
      - 'tests/**'
      - '.github/workflows/evaluate.yml'
  schedule:
    # Refresh summaries even if draw imports needed several attempts.
    - cron: '45 6 * * 0,4'
permissions:
  contents: write
concurrency:
  group: lottolab-data-writes
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py
      - name: Publish evaluated source coverage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/evaluation-summary.json
          if git diff --cached --quiet; then echo 'Evaluations unchanged'; exit 0; fi
          git commit -m 'data: refresh verified archive evaluation summary'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 4
          done
          exit 1
