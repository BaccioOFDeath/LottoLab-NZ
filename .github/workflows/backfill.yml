name: Incremental verified history backfill
on:
  workflow_dispatch:
  schedule:
    - cron: '45 13 * * *'
  push:
    paths:
      - 'scripts/backfill_recent.py'
      - '.github/workflows/backfill.yml'
permissions:
  contents: write
concurrency:
  group: lottolab-data-writes
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/backfill_recent.py --limit 8
      - run: python -m unittest discover -s tests -v
      - run: python scripts/model_engine.py
      - name: Commit confirmed history and update model scorecard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/draws.json data/model-performance.json data/model-picks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: import independently matched historical results'
          git pull --rebase origin main
          git push
