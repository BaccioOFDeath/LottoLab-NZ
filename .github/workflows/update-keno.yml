name: Update Keno data and pre-draw scorecard
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_keno.py'
      - '.github/workflows/update-keno.yml'
      - 'tests/test_keno.py'
      - 'tests/test_keno_math.cjs'
      - 'keno-math.js'
      - 'scripts/keno_model_audit.py'
      - 'scripts/keno_slot_picks.py'
      - 'tests/test_keno_slot_picks.py'
      - 'tests/test_keno_ticket_tools.cjs'
      - 'keno-ticket-tools.js'
  schedule:
    # Pre-draw NZST/NZDT windows, including 10am, 1pm, 3pm, 6pm draws.
    # GitHub may delay schedule delivery; the publisher checks actual NZ time.
    - cron: '35 20,21,23,0,1,2,4,5 * * *'
    # Shortly after published results to score the previous tickets.
    - cron: '35 3,6,22 * * *'
permissions:
  contents: write
concurrency:
  group: lottolab-data-writes
  cancel-in-progress: false
jobs:
  refresh-keno:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parsing dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Validate importer and model logic
        run: python -m unittest discover -s tests -p 'test_keno.py' -v
      - name: Validate independent draw-specific Keno prediction engine
        run: python -m unittest discover -s tests -p 'test_keno_slot_picks.py' -v
      - name: Verify exact Keno probability engine
        run: node --test tests/test_keno_math.cjs tests/test_keno_ticket_tools.cjs
      - name: Update Keno history, with conservative incremental backfill
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          backfill=0
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            backfill=500
          fi
          python scripts/update_keno.py --recent-days 7 --backfill-days "$backfill"
      - name: Publish locked predictions for each upcoming Keno draw time
        run: python scripts/keno_slot_picks.py
      - name: Produce out-of-sample Keno research audit
        run: python scripts/keno_model_audit.py
      - name: Publish new sourced records and dated research scorecards
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/keno-*.json
          if git diff --cached --quiet; then echo "No Keno changes"; exit 0; fi
          git commit -m 'data: refresh Keno draw history and retained daily scorecard'
          git pull --rebase origin main
          git push origin main
