name: Predict & score transparently
on:
  workflow_dispatch:
  schedule:
    # Run every NZ morning: refresh pre-draw records and score recovered results.
    - cron: '5 19 * * *'
  push:
    paths:
      - 'data/draws.json'
      - 'scripts/model_engine.py'
      - 'scripts/evolution_lotto.py'
      - 'tests/test_model_engine.py'
      - '.github/workflows/research-picker.yml'
permissions:
  contents: write
concurrency:
  group: lottolab-data-writes
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'requests>=2.31,<3'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/model_engine.py
      - name: Evaluate Lotto research evolution without changing published picks
        run: python scripts/evolution_lotto.py
      - name: Store timestamped picks and performance
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model-picks.json data/model-performance.json data/evolution-lotto.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: freeze and score audited LottoLab research picks'
          git pull --rebase origin main
          git push
