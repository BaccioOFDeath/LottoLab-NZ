name: Predict & score transparently
on:
  workflow_dispatch:
  schedule:
    - cron: '5 19 * * 2,5'
  push:
    paths:
      - 'data/draws.json'
      - 'scripts/model_engine.py'
permissions:
  contents: write
concurrency:
  group: lottolab-model-engine
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/model_engine.py
      - name: Store timestamped picks and performance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model-picks.json data/model-performance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: freeze and score audited LottoLab research picks'
          git pull --rebase origin main
          git push
