name: Predict & score transparently
on:
  workflow_dispatch:
  schedule:
    # Run every NZ morning: refresh pre-draw records and score recovered results.
    - cron: '5 19 * * *'
  push:
    paths:
      - 'data/draws.json'
      - 'scripts/model_engine.py'
      - 'scripts/evolution_lotto.py'
      - 'scripts/forward_ledger.py'
      - 'tests/test_forward_ledger.py'
      - 'tests/test_model_engine.py'
      - '.github/workflows/research-picker.yml'
permissions:
  contents: write
concurrency:
  group: lottolab-data-writes
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'requests>=2.31,<3'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/model_engine.py
      - name: Evaluate Lotto research evolution without changing published picks
        run: python scripts/evolution_lotto.py
      - name: Score locked Lotto research predictions
        run: python scripts/forward_ledger.py --game lotto --results data/draws.json --predictions data/model-picks.json --ledger data/forward-ledger-lotto.json
      - name: Store timestamped picks and performance
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/model-picks.json data/model-performance.json data/evolution-lotto.json data/forward-ledger-lotto.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: freeze and score audited LottoLab research picks'
          # Retry by rebuilding generated data on the latest main instead of
          # rebasing a stale generated-data commit over another refresh.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/model_engine.py
            python scripts/evolution_lotto.py
            python scripts/forward_ledger.py --game lotto --results data/draws.json --predictions data/model-picks.json --ledger data/forward-ledger-lotto.json
            git add data/model-picks.json data/model-performance.json data/evolution-lotto.json data/forward-ledger-lotto.json
            if git diff --cached --quiet; then echo 'Already published by another refresh'; exit 0; fi
            git commit -m 'data: refresh Lotto research and forward scorecard'
            sleep 3
          done
          exit 1
