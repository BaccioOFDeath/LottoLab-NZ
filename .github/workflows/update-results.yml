name: Verify Lotto results
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-results.yml'
      - 'scripts/update_results.py'
  schedule:
    - cron: '15 12,18 * * 3,6'
    # Later retries the following NZ day if external sources publish slowly.
    - cron: '15 0,6 * * 0,4'
permissions:
  contents: write
concurrency:
  group: lottolab-data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_results.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/model_engine.py
      - name: Publish verified draw and score model
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Avoid timestamp-only scorecard commits and needless rebase conflicts.
          # The daily model workflow independently refreshes performance.
          if git diff --quiet -- data/draws.json; then echo 'No new verified draw; no publication needed'; exit 0; fi
          git add data/draws.json data/model-picks.json data/model-performance.json
          git commit -m 'data: publish verified draw and audit research predictions'
          git pull --rebase origin main
          git push
