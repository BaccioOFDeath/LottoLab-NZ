name: Verify Lotto results
on:
  workflow_dispatch:
  schedule:
    - cron: '15 12,18 * * 3,6'
permissions:
  contents: write
concurrency:
  group: lotto-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_results.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/model_engine.py
      - name: Publish verified draw and score model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/draws.json data/model-picks.json data/model-performance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: publish verified draw and audit research predictions'
          git pull --rebase origin main
          git push
